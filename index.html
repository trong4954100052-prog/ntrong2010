<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Một món quà nhỏ dành cho bạn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Pacifico&family=Quicksand:wght@500;700&display=swap">
<style>
:root{--bg1:#ffe3ee;--bg2:#ffc2d9;--ink:#8a2447;--soft:#c2467a;--card:#fffafcd9;--btn:#ff6fa5;--btn2:#ff9ec3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1428;--bg2:#5c1d3f;--ink:#ffd3e4;--soft:#ff9ec3;--card:#4a1a33d9}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow:hidden;-webkit-tap-highlight-color:transparent}
body.night{background:radial-gradient(120% 90% at 50% 30%,#2b1240,#150c26 70%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow-y:auto}
.scr.on{display:flex}
.card{background:var(--card);border-radius:28px;padding:28px 24px;max-width:420px;width:100%;box-shadow:0 12px 40px #ff6fa540;margin:auto}
h1{font-family:'Pacifico',cursive;font-weight:400;margin:0 0 12px;line-height:1.3;font-size:1.9rem}
p{margin:0 0 14px;line-height:1.6}
input,textarea{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--btn2);background:#fff;color:#8a2447;font:700 16px 'Quicksand',sans-serif;outline:none}
#pw{text-align:center;border-radius:999px;margin-bottom:12px}
button{font:700 1.05rem 'Quicksand',sans-serif;color:#fff;background:linear-gradient(135deg,var(--btn),var(--btn2));border:0;border-radius:999px;padding:13px 26px;cursor:pointer;box-shadow:0 6px 16px #ff6fa56b;margin:6px;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
#err{color:#d62a68;min-height:1.4em;font-weight:700}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#cv,#fw{position:absolute;inset:0;width:100%;height:100%}
#cap{position:absolute;bottom:8%;left:0;right:0;font-weight:700;color:#ff9ec3;transition:opacity 1s}
#win{width:min(520px,100%);border:1px solid #ffffff26;border-radius:16px;background:#150c26d9;font-family:'JetBrains Mono',ui-monospace,monospace;text-align:left;box-shadow:0 20px 60px #0009;overflow:hidden;margin:auto}
#wb{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid #ffffff1f;color:#a78bb8;font-size:.76rem}
#wb b{width:10px;height:10px;border-radius:50%;background:#ff5f57}#wb b:nth-child(2){background:#febc2e}#wb b:nth-child(3){background:#28c840}
#wn{margin-left:auto}
#wc{padding:18px 16px 20px}
#qc{color:#a78bb8;font-size:.82rem;margin-bottom:8px}
#qt{font:700 clamp(1.05rem,4.8vw,1.25rem)/1.5 'JetBrains Mono',monospace;color:#f4e9f7;min-height:3.6em;margin:0 0 12px}
#qa{background:#ffffff10;border:1px solid #ffffff33;color:#f4e9f7;font:16px 'JetBrains Mono',monospace;min-height:110px;resize:vertical;caret-color:#5ce1e6}
#qo{color:#7ee0a8;font-size:.86rem;min-height:1.5em;margin:8px 0}#qo.err{color:#ff7a90}
#qn{width:100%;margin:4px 0 0;font-family:'JetBrains Mono',monospace;font-size:.95rem}
#qp{position:absolute;top:0;left:0;right:0;height:3px;background:#ffffff1a}
#qp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5c9d,#5ce1e6);transition:width .6s}
.night .card{background:#ffffff12;border:1px solid #ff9ec35a;box-shadow:0 0 50px #ff5c9d40;color:#ffe3f0}
.night h1,.night p{color:#ffe3f0}
#et{font-size:1.9rem;background:linear-gradient(90deg,#ff3d8b,#ff9e5e);-webkit-background-clip:text;background-clip:text;color:transparent;min-height:2.6em}
#ew{min-height:7em}#bs{font:700 .8rem 'JetBrains Mono',monospace;color:#7ee0a8;min-height:1.4em;margin-bottom:8px}
#sync{font-size:.8rem;opacity:.8;min-height:1.2em;margin:4px 0}
.fall{position:fixed;top:-30px;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fall,.shake{animation:none}}
[hidden]{display:none!important}
#adm{justify-content:flex-start;background:#150c26;color:#f4e9f7;text-align:left}
#adm h1{color:#ff9ec3}
.ac{border:1px solid #ff9ec35a;border-radius:14px;padding:12px 14px;margin:10px 0;background:#ffffff0d;width:100%;max-width:640px;overflow-wrap:anywhere;font-size:.95rem}
.ac b{color:#5ce1e6}.ac small{opacity:.7}
#ring{position:relative;width:170px;height:170px;margin:8px auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;border-radius:50%}
#ring svg{width:100%;height:100%;display:block}
#rh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.4rem;color:#ff5c9d}
#rp{text-align:center;color:#ffe3f0;font-weight:700;min-height:1.6em;margin-bottom:6px}
.up{position:fixed;z-index:20;pointer-events:none;font-size:20px;animation:upk 1s ease-out forwards}
@keyframes upk{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.ln{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;padding:12px 14px;margin:8px 0;border:1px solid #ffffff26;border-radius:12px;background:#ffffff0d;color:#f4e9f7;font:inherit;font-size:.95rem;text-align:left;cursor:pointer;box-shadow:none}
.ln:active,.ln:focus-visible{border-color:#ff5c9d;background:#ff5c9d22}.ln i{font-style:normal;min-width:2.2em}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:none;pointer-events:none}body.night #sky{display:block}
#end .card{will-change:transform;transition:transform .15s ease-out;overflow:hidden}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .5s}
#end .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(115deg,transparent 20%,#ff5c9d40 35%,#5ce1e640 50%,#ffc85740 65%,transparent 80%);background-size:250% 250%;background-position:var(--hx,50%) var(--hy,50%)}
#boot{margin-top:4px}
#br{position:relative;width:150px;height:150px;margin:6px auto 4px;filter:drop-shadow(0 0 8px #ff5c9d88)}
#br svg{width:100%;height:100%;display:block}
#bk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.8rem}
#bp{font:700 1.1rem 'JetBrains Mono',monospace;color:var(--ink);margin-bottom:8px}
#bl{background:#150c26;border-radius:14px;padding:12px 14px;text-align:left;font:700 .78rem/1.7 'JetBrains Mono',monospace;color:#7ee0a8;min-height:6.6em;overflow-wrap:anywhere}
#bl b{color:#ffc857}
#br.pop{animation:bpop .7s ease-out}
@keyframes bpop{40%{transform:scale(1.25);filter:drop-shadow(0 0 28px #ffc857)}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="fl"></div>
<section class="scr on" id="lock">
  <div class="card">
    <div id="lk" style="font-size:3.2rem">🔒</div>
    <h1>Gửi bạn 💌</h1>
    <p id="ls">Có một món quà nhỏ đang chờ bạn. Nhập mật mã riêng của bạn để mở nhé…</p>
    <input id="pw" type="text" placeholder="Mật mã của bạn" autocomplete="off" autocapitalize="off" enterkeyhint="go">
    <div id="err"></div>
    <div id="boot" hidden>
      <div id="br"><svg viewBox="0 0 120 120"><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5c9d"/><stop offset=".5" stop-color="#ffc857"/><stop offset="1" stop-color="#5ce1e6"/></linearGradient></defs><circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff22" stroke-width="6"/><circle id="barc" cx="60" cy="60" r="52" fill="none" stroke="url(#bg2)" stroke-width="7" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 60 60)"/></svg><span id="bk">🔒</span></div>
      <div id="bp">0%</div>
      <div id="bl"></div>
    </div>
    <button id="go">Mở quà</button>
  </div>
</section>

<section class="scr" id="stage"><canvas id="cv"></canvas><div id="cap">Chạm hoặc kéo ngón tay để chơi với trái tim 💕</div></section>

<section class="scr" id="quiz">
  <div id="qp"><i></i></div>
  <div id="win">
    <div id="wb"><b></b><b></b><b></b><span style="margin-left:8px" id="wf"></span><span id="wn"></span></div>
    <div id="wc"><div id="qc"></div><h2 id="qt"></h2><div id="xt"></div><textarea id="qa" maxlength="400" placeholder="gõ câu trả lời của bạn…" enterkeyhint="done"></textarea><div id="qo"></div><button id="qn" type="button">▶ Gửi câu trả lời</button></div>
  </div>
</section>

<section class="scr" id="end">
  <canvas id="fw"></canvas>
  <div class="card" style="position:relative">
    <div id="bs"></div><h1 id="et"></h1>
    <p id="ew"></p>
    <div style="font-size:2rem">🌸💖🌸</div>
    <div id="sync"></div>
    <button id="again" hidden>Xem lại trái tim 💖</button><button id="cp" hidden>Sao chép câu trả lời 📋</button>
  </div>
</section>

<section class="scr" id="adm">
  <h1>Bảng admin 🔐</h1>
  <div><button id="rf">Làm mới</button><button id="ca">Sao chép tất cả</button><button id="ex">Thoát</button></div>
  <div id="as" style="min-height:1.4em"></div>
  <div id="al" style="width:100%;max-width:640px"></div>
</section>

<script>
/* ====== CHỈNH SỬA Ở ĐÂY ====== */
// Mật mã (viết thường) → tên + lời chúc RIÊNG của từng bạn. Dùng {name} để chèn tên.
const GUESTS = {
  "02072008": {name:"Dieu Khang", wish:"Chúc {name} 20/10 luôn vui vẻ và tràn đầy năng lượng tích cực! Mong bạn dù gặp chuyện gì cũng tìm được lý do để tiếp tục cố gắng, luôn giữ niềm tin vào những điều tốt đẹp và lan tỏa nụ cười đến mọi người. Chúc cuộc sống của bạn có thật nhiều niềm vui, những bất ngờ đáng yêu và những ngày bình yên bên người thân, bạn bè! ☀️"},
  "04062008": {name:"Hoang Diem", wish:"Chúc {name} 20/10 luôn vui vẻ và tràn đầy năng lượng tích cực! Mong bạn dù gặp chuyện gì cũng tìm được lý do để tiếp tục cố gắng, luôn giữ niềm tin vào những điều tốt đẹp và lan tỏa nụ cười đến mọi người. Chúc cuộc sống của bạn có thật nhiều niềm vui, những bất ngờ đáng yêu và những ngày bình yên bên người thân, bạn bè! ☀️"},
  "04072008": {name:"Bao Han", wish:"Chúc {name} 20/10 thật tỏa sáng! Mong bạn luôn tự tin vào giá trị của bản thân, giữ vững phong thái riêng và không ngừng phát triển những điểm mạnh của mình. Chúc bạn luôn nổi bật không chỉ bởi sự tự tin mà còn bởi tài năng, lòng tốt và những điều tích cực bạn mang đến cho mọi người. Cứ tự tin bước về phía trước và chinh phục những điều tuyệt vời đang chờ bạn nhé! 🌟"},
  "12345": {name:"tai khoan test", wish:"Chúc {name} 20/10 thật tỏa sáng! Mong bạn luôn tự tin vào giá trị của bản thân, giữ vững phong thái riêng và không ngừng phát triển những điểm mạnh của mình. Chúc bạn luôn nổi bật không chỉ bởi sự tự tin mà còn bởi tài năng, lòng tốt và những điều tích cực bạn mang đến cho mọi người. Cứ tự tin bước về phía trước và chinh phục những điều tuyệt vời đang chờ bạn nhé! 🌟"},
  "11122008": {name:"Da Hao", wish:"Chúc {name} 20/10 vui vẻ, xinh đẹp và đặc biệt là bớt tấu hài lại một chút để mọi người còn có cơ hội thể hiện! 😂 Mong bà luôn giữ được nguồn năng lượng tích cực, đi đến đâu mang tiếng cười đến đó. Chúc bà học hành thuận lợi, tiền vào như nước, niềm vui đầy túi và lúc nào cũng cười tươi như hôm nay!"},
  "01122008": {name:"Hoa Linh", wish:"Chúc {name} 20/10 ngập tràn niềm vui và yêu thương! Cảm ơn bạn vì luôn thân thiện, cởi mở và mang đến cảm giác gần gũi cho mọi người. Mong rằng sự nhiệt tình và nụ cười của bạn sẽ luôn là nguồn năng lượng tích cực của lớp mình. Chúc bạn có thật nhiều bạn tốt, nhiều kỷ niệm đẹp và một thanh xuân thật đáng nhớ! 🌻"},
  "28102008": {name:"Anh Linh", wish:"Chúc {name} 20/10 thật hạnh phúc và luôn giữ được tinh thần ham học hỏi, sự chăm chỉ cùng ý chí tiến về phía trước. Mong mọi nỗ lực của bạn đều được đền đáp xứng đáng, bài nào cũng hiểu, thi nào cũng tự tin và đạt được những mục tiêu mình đã đặt ra. Nhưng nhớ dành thời gian nghỉ ngơi, tận hưởng tuổi trẻ và yêu thương bản thân nhiều hơn nhé! 🌷"},
  "20071995": {name:"Kim Ngan", wish:"Chúc {name} 20/10 thật hạnh phúc và luôn giữ được tinh thần ham học hỏi, sự chăm chỉ cùng ý chí tiến về phía trước. Mong mọi nỗ lực của bạn đều được đền đáp xứng đáng, bài nào cũng hiểu, thi nào cũng tự tin và đạt được những mục tiêu mình đã đặt ra. Nhưng nhớ dành thời gian nghỉ ngơi, tận hưởng tuổi trẻ và yêu thương bản thân nhiều hơn nhé! 🌷"},
  "05062008": {name:"Hien Nhi", wish:"Chúc {name} 20/10 thật vui vẻ! Dù bạn không phải người nói nhiều hay thể hiện cảm xúc ra bên ngoài, mong bạn vẫn luôn cảm nhận được sự quan tâm và yêu quý từ mọi người xung quanh. Chúc bạn luôn bình an, gặp nhiều may mắn, học tập thuận lợi và có thật nhiều niềm vui theo cách riêng của mình. Ít nói cũng được, nhưng hôm nay nhớ cười nhiều hơn một chút nhé! 😊"},
  "1108208": {name:"Le Quyen", wish:"Chúc {name} 20/10 thật rực rỡ! Mong bạn luôn tự tin, bản lĩnh, dám nghĩ dám làm và không ngại theo đuổi những điều mình yêu thích. Hãy cứ sống theo cách của mình, giữ vững cá tính và tỏa sáng theo cách chẳng ai có thể thay thế. Chúc bạn ngày càng thành công và luôn gặp những người xứng đáng với sự chân thành của mình! ✨"},
  "03012008": {name:"Thuy Trang", wish:"Chúc {name} 20/10 thật vui vẻ! Dù bạn không phải người nói nhiều hay thể hiện cảm xúc ra bên ngoài, mong bạn vẫn luôn cảm nhận được sự quan tâm và yêu quý từ mọi người xung quanh. Chúc bạn luôn bình an, gặp nhiều may mắn, học tập thuận lợi và có thật nhiều niềm vui theo cách riêng của mình. Ít nói cũng được, nhưng hôm nay nhớ cười nhiều hơn một chút nhé! 😊"},
  "12012008": {name:"Tuong Vi", wish:"Chúc {name} 20/10 thật nhiều niềm vui, luôn giữ được sự dịu dàng và nét đáng yêu của riêng mình. Mong rằng mỗi ngày của bạn đều bình yên, luôn có người quan tâm, yêu thương và trân trọng bạn. Chúc bạn học tập thật tốt, mọi điều mong muốn đều dần trở thành hiện thực nhé! "},
  "12092008": {name:"Le Trang", wish:"Chúc {name} 20/10 vui vẻ, xinh tươi và nghịch có chừng mực nha! 🤣 Mong bà luôn tràn đầy năng lượng, học hành tiến bộ, không bị thầy cô gọi tên bất ngờ và không bao giờ thiếu đồng đội trong những pha quậy phá. Chúc bà mãi vui tính, đáng yêu và tạo thêm thật nhiều kỷ niệm khó quên với lớp mình!"}
};
const ADMIN_PASS = "admin@2026";
const FROM = "";
// Địa chỉ Firebase Realtime Database (không có dấu / ở cuối). Ví dụ:
// "https://ten-project-default-rtdb.asia-southeast1.firebasedatabase.app"
const DB_URL = "";
// 3 câu hỏi tự luận (bạn tự gõ chữ để trả lời)
const QUESTIONS = [
  "Nếu cuộc đời bạn là một bộ phim, bạn sẽ đặt tên bộ phim đó là gì?",
  "Nếu được đổi chỗ ngồi với bất kỳ ai trong lớp một ngày, bạn sẽ chọn ai? Vì sao?",
  "Nếu có thể sở hữu một siêu năng lực, bạn muốn có năng lực gì?"
];
// Thứ tự các bước: q = câu tự luận, hold = nạp đầy trái tim, gift = chọn hộp quà
const FLOW = ["q", "q", "hold", "q", "gift"];
// Các món quà bí mật (mỗi bạn chọn 1 hộp)
const GIFTS = [ "Lốc sting ", "Nụ hôn lốc xoáy "];
/* ============================== */

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); document.body.classList.toggle('night', id !== 'lock'); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const typeIt = async (el, txt, sp = 28) => { el.textContent = ''; for (const ch of txt) { el.textContent += ch; await wait(sp); } };
let KEY = "", G = null, answers = [];

/* ----- Lưu trữ: Firebase (mọi thiết bị) + localStorage (dự phòng trên máy này) ----- */
const LS = 'giftAnswers';
const lsAll = () => { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch(e){ return {}; } };
const lsSet = (k, v) => { try { const a = lsAll(); a[k] = v; localStorage.setItem(LS, JSON.stringify(a)); } catch(e){} };
async function save(){
  const rec = {name:G.name, answers, gift:picked, ts:new Date().toISOString()};
  lsSet(KEY, rec);
  if (!DB_URL) return false;
  try {
    const r = await fetch(`${DB_URL}/answers/${encodeURIComponent(KEY)}.json`, {method:'PUT', body:JSON.stringify(rec)});
    return r.ok;
  } catch(e){ return false; }
}

/* ----- Đăng nhập ----- */
function tryOpen(){
  const k = $('pw').value.trim().toLowerCase();

    const c = document.createElement('div'); c.className = 'ac';

    const s = document.createElement('small'); s.textContent = '  ' + new Date(v.ts).toLocaleString('vi-VN'); h.append(b, s); c.append(h); if (v.gift) { const g = document.createElement('div'); g.textContent = '🎁 ' + v.gift; g.style.marginTop = '6px'; c.append(g); }
    QUESTIONS.forEach((q, i) => { const p = document.createElement('p'); p.style.margin = '8px 0 0'; p.textContent = `${i+1}. ${q}\n→ ${(v.answers || [])[i] || '(chưa trả lời)'}`; p.style.whiteSpace = 'pre-wrap'; c.append(p); });
    return c;
  }));
}
$('rf').onclick = openAdmin; $('ex').onclick = () => show('lock');
$('ca').onclick = async () => { try { await navigator.clipboard.writeText(adminText); $('as').textContent = 'Đã sao chép tất cả ✓'; } catch(e){ $('as').textContent = 'Không sao chép được'; } };
</script>
